name: CW 2.0 migration

on:
  push:
    branches:
      - cw-2.0-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[cw20-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch locked standards
        run: |
          curl --fail --silent --show-error --location https://aigm.fi/format/Canonical_Contract_Format.json -o Canonical_Contract_Format.json
          curl --fail --silent --show-error --location https://aigm.fi/format/Canonical_Wireframe_Dependency_Rules.json -o Canonical_Wireframe_Dependency_Rules.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'Canonical_Contract_Format.json': ('2.0.0', 'locked'),
              'Canonical_Wireframe_Dependency_Rules.json': ('2.0.0', 'locked'),
          }
          for name, (version, status) in expected.items():
              d = json.loads(Path(name).read_text(encoding='utf-8'))
              assert d.get('version') == version, (name, d.get('version'))
              assert d.get('status') == status, (name, d.get('status'))
              print(f'{name}: {version} {status}')
          PY

      - name: Run deterministic CCF 2.0 migration
        run: python tools/migrate_aigmos_cw_to_2_0.py

      - name: Remove unresolved Link authority without guessing
        run: python tools/close_cw20_link_endpoints.py

      - name: Validate migrated JSON and canonical identity namespace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('canonical/json').rglob('*.json'))
          bad = []
          seen = {}
          collisions = []
          counts = {'entities': 0, 'properties': 0, 'links': 0, 'events': 0, 'effects': 0}

          for p in files:
              d = json.loads(p.read_text(encoding='utf-8'))
              if d.get('format', {}).get('format_version') != '2.0':
                  bad.append(f'{p}: format_version')
              if d.get('status') != 'unlocked':
                  bad.append(f'{p}: status={d.get("status")}')
              if any(k in d for k in ('links', 'behavior', 'structure', 'topics')):
                  bad.append(f'{p}: legacy top-level authority present')
              for e in d.get('entities', []):
                  counts['entities'] += 1
                  eid = e.get('id')
                  if eid in seen:
                      collisions.append((eid, seen[eid], (str(p), 'Entity')))
                  else:
                      seen[eid] = (str(p), 'Entity')
                  for prop in e.get('properties', []):
                      counts['properties'] += 1
                      pid = prop.get('id')
                      if pid in seen:
                          collisions.append((pid, seen[pid], (str(p), 'Property')))
                      else:
                          seen[pid] = (str(p), 'Property')
                      pt = prop.get('property_type_ref')
                      counts['links'] += pt == 'link'
                      counts['events'] += pt == 'event'
                      counts['effects'] += pt == 'effect'

          if bad:
              raise SystemExit('\n'.join(bad[:100]))
          if collisions:
              raise SystemExit('Canonical identity collisions:\n' + '\n'.join(map(str, collisions[:100])))
          print(f'JSON syntax OK: {len(files)} canonical files')
          print(f'Canonical identity namespace OK: {len(seen)} identities')
          print(counts)
          PY

      - name: Validate Link endpoint closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          docs = []
          ids = set()
          for p in sorted(Path('canonical/json').rglob('*.json')):
              d = json.loads(p.read_text(encoding='utf-8'))
              docs.append((p, d))
              for e in d.get('entities', []):
                  ids.add(e.get('id'))
                  ids.update(prop.get('id') for prop in e.get('properties', []))

          unresolved = []
          for p, d in docs:
              for e in d.get('entities', []):
                  for prop in e.get('properties', []):
                      if prop.get('property_type_ref') != 'link':
                          continue
                      v = prop.get('value', {})
                      for endpoint in ('parent_ref', 'child_ref'):
                          ref = v.get(endpoint)
                          if ref and ref not in ids:
                              unresolved.append((str(p), prop.get('id'), endpoint, ref))

          report = {
              'unresolved_link_endpoint_count': len(unresolved),
              'examples': unresolved[:200],
          }
          Path('cw20-link-closure-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if unresolved:
              raise SystemExit('Active Link endpoint closure failed')
          PY

      - name: Commit migration result
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "AIGMos CW migration"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/json \
            Canonical_Contract_Format.json \
            Canonical_Wireframe_Dependency_Rules.json \
            AIGMos_Dependency_Rules_v2.0.0-migration.json \
            cw20-migration-report.json \
            cw20-link-closure-cleanup-report.json \
            cw20-link-closure-report.json
          git commit -m "Close AIGMos CCF 2.0 Link endpoint authority [cw20-migrated]"
          git push
